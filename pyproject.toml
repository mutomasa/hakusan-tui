[project]
name = "hakusan-tui"
dynamic = ["version"]
description = "JAIST HAKUSAN 向け Slurm / GPU / Job 統合ターミナルUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "platformdirs>=4.0",
]

[project.scripts]
hakusan-tui = "hakusan_tui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# バージョンは src/hakusan_tui/__init__.py の __version__ だけで管理する（セマンティックバージョニング）
path = "src/hakusan_tui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hakusan_tui"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slurm: 実Slurm（Docker）が必要な結合テスト"]
addopts = "-m 'not slurm'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
