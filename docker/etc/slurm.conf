# テスト用。HAKUSANの実構成ではない（名前だけ似せている）。
ClusterName=hakusan-test
SlurmctldHost=ctl
AuthType=auth/munge
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
MpiDefault=none
ReturnToService=2
SlurmdParameters=config_overrides
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
DefMemPerCPU=250
GresTypes=gpu
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=ctl
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
JobCompType=jobcomp/none
MinJobAge=60
Prolog=/etc/slurm/prolog.sh
Epilog=/etc/slurm/epilog.sh
TaskProlog=/etc/slurm/task_prolog.sh
NodeName=lcpcc-001 CPUs=4 RealMemory=2000 State=UNKNOWN
NodeName=spcc-a40g01 CPUs=4 RealMemory=2000 Gres=gpu:a40:2 State=UNKNOWN
PartitionName=DEF Nodes=lcpcc-001 Default=YES MaxTime=1-00:00:00 State=UP
PartitionName=TINY Nodes=lcpcc-001 MaxTime=00:30:00 State=UP
PartitionName=GPU-1 Nodes=spcc-a40g01 MaxTime=12:00:00 State=UP
PartitionName=GPU-S Nodes=spcc-a40g01 MaxTime=12:00:00 State=UP
